<!doctype html>
<html lang="sr-Latn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Stranica nije pronađena | Eurocompass</title>
    <link rel="icon" type="image/webp" href="/images/eurocompass-icon.webp" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f9fafb;
        color: #1e293b;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      main { max-width: 28rem; }
      h1 { margin: 0 0 12px; font-size: 1.875rem; }
      p { margin: 0 0 24px; line-height: 1.6; color: #374151; }
      a {
        display: inline-block;
        margin: 4px;
        padding: 10px 20px;
        border-radius: 8px;
        background: #f5a623;
        color: #111827;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #111827; outline-offset: 2px; }
      a.secondary { background: transparent; border: 2px solid #1e293b; color: #1e293b; padding: 8px 18px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Stranica nije pronađena</h1>
      <p>
        Adresa koju ste uneli ne postoji ili je stranica premeštena. Pogledajte
        polaske ili rezervišite kartu.
      </p>
      <a href="/">Početna strana</a>
      <a class="secondary" href="/rezervacije">Rezervacija karte</a>
    </main>
  </body>
</html>
