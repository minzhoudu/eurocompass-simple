<!doctype html>
<html lang="sr-Latn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Nema internet veze | Eurocompass</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f9fafb;
        color: #1f2937;
        text-align: center;
      }
      main { max-width: 26rem; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 1.5rem; margin: 1.25rem 0 0.5rem; }
      p { line-height: 1.55; margin: 0.5rem 0; color: #4b5563; }
      a, button {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.7rem 1.4rem;
        border: 0;
        border-radius: 0.6rem;
        background: #f5a623;
        color: #111827;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
      a:focus-visible, button:focus-visible { outline: 3px solid #111827; outline-offset: 2px; }
      @media (prefers-color-scheme: dark) {
        body { background: #0f172a; color: #f1f5f9; }
        p { color: #cbd5e1; }
        a:focus-visible, button:focus-visible { outline-color: #f1f5f9; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Nema internet veze</h1>
      <p>Ova stranica nije sačuvana na vašem uređaju. Proverite vezu i pokušajte ponovo.</p>
      <p>Rezervacije i informacije: <a href="tel:+38137443277" style="margin:0;padding:0;background:none;color:inherit;font-weight:700;text-decoration:underline">037/443-277</a></p>
      <button type="button" onclick="location.reload()">Pokušaj ponovo</button>
    </main>
  </body>
</html>
